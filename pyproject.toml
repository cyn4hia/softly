[project]
name = "softly"
version = "0.1.0"
description = "adaptive video-generation agent with a feedback-loop learning core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "anthropic>=0.119",
    "av>=13.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
softly = "softly.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["softly"]
